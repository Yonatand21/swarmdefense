[project]
name = "swarm-sandbox"
version = "0.0.0"
description = "Counter-swarm engagement sandbox: cost and saturation, not lethality."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
swarm-sandbox = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "server"]
packages = ["engine", "schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: deliberately slow tests (real engine, large sweeps)",
    "integration: end-to-end tests that exercise the real engine",
]
